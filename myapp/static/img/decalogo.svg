<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-labelledby="titulo">
  <title id="titulo">Miniatura del decálogo de las ramas del Derecho</title>

  <!-- Hoja -->
  <rect x="2" y="2" width="316" height="396" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>

  <!-- Cabecera azul con la balanza -->
  <path d="M2 20a18 18 0 0 1 18-18h280a18 18 0 0 1 18 18v74H2z" fill="#1E4FA3"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 24v40M28 32h32M28 32l-9 18a9 9 0 0 0 18 0zM60 32l-9 18a9 9 0 0 0 18 0zM36 64h16"/>
  </g>
  <text x="84" y="48" fill="#FFFFFF" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="30" font-weight="700">Decálogo</text>
  <text x="84" y="74" fill="#DCE7F8" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16">Ramas del Derecho</text>

  <!-- Lista: 1 a 5 -->
  <g font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="40" cy="128" r="16" fill="#1E4FA3"/><text x="40" y="134" fill="#FFFFFF">1</text>
    <circle cx="40" cy="180" r="16" fill="#1E4FA3"/><text x="40" y="186" fill="#FFFFFF">2</text>
    <circle cx="40" cy="232" r="16" fill="#1E4FA3"/><text x="40" y="238" fill="#FFFFFF">3</text>
    <circle cx="40" cy="284" r="16" fill="#8A3F06"/><text x="40" y="290" fill="#FFFFFF">4</text>
    <circle cx="40" cy="336" r="16" fill="#8A3F06"/><text x="40" y="342" fill="#FFFFFF">5</text>
  </g>

  <!-- Líneas de texto -->
  <g fill="#9AA8BC">
    <rect x="70" y="118" width="190" height="8" rx="4" fill="#14213D"/>
    <rect x="70" y="132" width="140" height="7" rx="3.5"/>
    <rect x="70" y="170" width="170" height="8" rx="4" fill="#14213D"/>
    <rect x="70" y="184" width="200" height="7" rx="3.5"/>
    <rect x="70" y="222" width="150" height="8" rx="4" fill="#14213D"/>
    <rect x="70" y="236" width="180" height="7" rx="3.5"/>
    <rect x="70" y="274" width="180" height="8" rx="4" fill="#14213D"/>
    <rect x="70" y="288" width="130" height="7" rx="3.5"/>
    <rect x="70" y="326" width="160" height="8" rx="4" fill="#14213D"/>
    <rect x="70" y="340" width="190" height="7" rx="3.5"/>
  </g>

  <!-- Pequeños dibujos a la derecha -->
  <circle cx="284" cy="128" r="10" fill="#FFD24D"/>
  <circle cx="284" cy="232" r="10" fill="#DCE7F8"/>
  <circle cx="284" cy="336" r="10" fill="#FDF0E1"/>

  <!-- Pie amarillo: "y 5 más" -->
  <rect x="22" y="364" width="276" height="22" rx="8" fill="#FFF6D6"/>
  <text x="160" y="380" fill="#14213D" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">… y 5 ramas más</text>
</svg>
